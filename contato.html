<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfólio pessoal de Guilherme de Souza de Oliveira.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="media/icon.ico">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
    <title>Guilherme Oliveira</title>
</head>
<body>

<header id="header"> <!-- Separação - Topo -->

    <nav id="nav"> <!-- Caixa de navegação -->
        <ul id="items"> <!-- Caixa de Items -->
            <li class="item-caixa box-items"><span onclick="transicaoPagina('index.html')" class="item">Sobre mim</span></li>
            <li class="item-caixa box-items"><span onclick="transicaoPagina('formacao.html')" class="item">Formação</span></li>
            <li class="item-caixa box-items"><span onclick="transicaoPagina('portfolio.html')" class="item">Portfólio</span></li>
            <li class="item-caixa box-items"><span onclick="transicaoPagina('contato.html')" class="item" style="background-color: var(--cor-terciaria); color: var(--cor-branca)">Contato</span></li>
        </ul>
    </nav>

</header>

<main id="main">  <!-- Separação - Principal -->

    <div id="caixa-principal-contato"> <!-- Caixa principal -->
        <div id="caixa-contato">
            <div id="github-email">
                <a target="_blank" rel="noopener noreferrer" href="https://github.com/guiolivi" class="caixas box-grow" id="github"> <!-- Perfil do GitHub  -->
                    <div class="titulo">Perfil do GitHub</div>
                    <div id="descricao-github">Veja meus outros repositórios</div>
                    <img src="media/github-icon.svg" alt="Ícone GitHub" id="perfil-github">
                </a>

                <div class="caixas box-grow" id="email"> <!-- E-mail profissional  -->
                    <a href="mailto:guilherme@profissional.tech" id="caixa-email">
                        <img src="media/email-icon.svg" alt="Ícone E-mail" id="icone-email">
                        <div id="enviar-email">guilherme@profissional.tech</div>
                    </a>
                </div>
            </div>
            <form action="https://formsubmit.co/guilherme@profissional.tech" method="POST" target="_blank" id="formulario">
                <div id="formularios">
                    <div id="formulario-esquerda"> <!-- Parte Esquerda -->
                        <div id="formulario-titulo">Formulário para Contato</div>

                        <div class="caixas" id="campo-nome">
                            <label for="input-nome" id="label-nome">Nome</label>
                            <input type="text" name="Nome" id="input-nome" maxlength="64" placeholder="Digite seu nome completo" required>
                        </div>
                        <div class="caixas" id="campo-email">
                            <label for="input-email" id="label-email">E-mail</label>
                            <input type="email" name="E-mail" id="input-email" maxlength="64" placeholder="exemplo@email.com" required>
                        </div>
                        <button class="caixas box-button" id="campo-enviar">Enviar</button>
                    </div>

                    <div id="formulario-direita"> <!-- Parte Direita -->
                        <div class="caixas" id="campo-mensagem">
                            <label for="input-mensagem" id="label-mensagem">Mensagem</label>
                            <textarea name="Mensagem" id="input-mensagem" maxlength="5000" placeholder="Insira sua mensagem" required></textarea>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

</main>

</body>
</html>
